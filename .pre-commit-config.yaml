---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace
        exclude: ^frontend/src/gen/
      - id: end-of-file-fixer
        exclude: ^frontend/src/gen/
      - id: check-yaml
        exclude: ^frontend/src/gen/|^docs/content/examples/kubernetes-icehive\.yaml$
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix', 'lf']
        exclude: ^frontend/src/gen/
      - id: check-json
        exclude: ^frontend/src/gen/
      - id: check-case-conflict
      - id: detect-aws-credentials

  # Alternative semantic commit checker
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.1.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [] # optional: list of Conventional Commits types to allow e.g. [feat, fix, ci, chore, test]

  - repo: local
    hooks:
      - id: services-codestyle
        name: services-codestyle
        entry: make services-codestyle
        language: system
        pass_filenames: false
        files: ^(services/|protocol/|Makefile|go\.work|\.golangci\.yml)

      - id: frontend-codestyle
        name: frontend-codestyle
        entry: make frontend-codestyle
        language: system
        pass_filenames: false
        files: ^(frontend/|Makefile)

      - id: frontend-unittests
        name: frontend-unittests
        entry: make frontend-unittests
        language: system
        pass_filenames: false
        files: ^(frontend/|Makefile)

      - id: services-unittests
        name: services-unittests
        entry: make services-unittests
        language: system
        pass_filenames: false
        files: ^(services/|protocol/|Makefile|go\.work)

      - id: services-build
        name: services-build
        entry: make services
        language: system
        pass_filenames: false
        files: ^(services/|protocol/|Makefile|go\.work)

      - id: it
        name: integration-tests
        entry: make integration-tests
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(services/|frontend/|integration-tests/|protocol/|Makefile)
