project_name: icehive
version: 2

builds:
  - id: controller
    env:
      - CGO_ENABLED=0
    binary: controller
    main: .
    dir: services/controller
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/icehive/icehive/services/common/pkg/buildinfo.Version={{.Version}} -X github.com/icehive/icehive/services/common/pkg/buildinfo.Commit={{.ShortCommit}} -X github.com/icehive/icehive/services/common/pkg/buildinfo.Date={{ .CommitDate }}

  - id: collector-github
    env:
      - CGO_ENABLED=0
    binary: collector-github
    main: .
    dir: services/collector-github
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/icehive/icehive/services/common/pkg/buildinfo.Version={{.Version}} -X github.com/icehive/icehive/services/common/pkg/buildinfo.Commit={{.ShortCommit}} -X github.com/icehive/icehive/services/common/pkg/buildinfo.Date={{ .CommitDate }}

  - id: collector-azure
    env:
      - CGO_ENABLED=0
    binary: collector-azure
    main: .
    dir: services/collector-azure
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/icehive/icehive/services/common/pkg/buildinfo.Version={{.Version}} -X github.com/icehive/icehive/services/common/pkg/buildinfo.Commit={{.ShortCommit}} -X github.com/icehive/icehive/services/common/pkg/buildinfo.Date={{ .CommitDate }}

  - id: collector-jmap
    env:
      - CGO_ENABLED=0
    binary: collector-jmap
    main: .
    dir: services/collector-jmap
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/icehive/icehive/services/common/pkg/buildinfo.Version={{.Version}} -X github.com/icehive/icehive/services/common/pkg/buildinfo.Commit={{.ShortCommit}} -X github.com/icehive/icehive/services/common/pkg/buildinfo.Date={{ .CommitDate }}

  - id: collector-rss
    env:
      - CGO_ENABLED=0
    binary: collector-rss
    main: .
    dir: services/collector-rss
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/icehive/icehive/services/common/pkg/buildinfo.Version={{.Version}} -X github.com/icehive/icehive/services/common/pkg/buildinfo.Commit={{.ShortCommit}} -X github.com/icehive/icehive/services/common/pkg/buildinfo.Date={{ .CommitDate }}

  - id: collector-testdata
    env:
      - CGO_ENABLED=0
    binary: collector-testdata
    main: .
    dir: services/collector-testdata
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/icehive/icehive/services/common/pkg/buildinfo.Version={{.Version}} -X github.com/icehive/icehive/services/common/pkg/buildinfo.Commit={{.ShortCommit}} -X github.com/icehive/icehive/services/common/pkg/buildinfo.Date={{ .CommitDate }}

  - id: persister-mysql
    env:
      - CGO_ENABLED=0
    binary: persister-mysql
    main: .
    dir: services/persister-mysql
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/icehive/icehive/services/common/pkg/buildinfo.Version={{.Version}} -X github.com/icehive/icehive/services/common/pkg/buildinfo.Commit={{.ShortCommit}} -X github.com/icehive/icehive/services/common/pkg/buildinfo.Date={{ .CommitDate }}

  - id: persister-yaml
    env:
      - CGO_ENABLED=0
    binary: persister-yaml
    main: .
    dir: services/persister-yaml
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/icehive/icehive/services/common/pkg/buildinfo.Version={{.Version}} -X github.com/icehive/icehive/services/common/pkg/buildinfo.Commit={{.ShortCommit}} -X github.com/icehive/icehive/services/common/pkg/buildinfo.Date={{ .CommitDate }}

archives:
  - formats: tar.gz
    files:
      - LICENSE
      - README.md
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

dockers:
  - ids:
      - controller
      - collector-github
      - collector-azure
      - collector-jmap
      - collector-rss
      - collector-testdata
      - persister-mysql
      - persister-yaml
    image_templates:
      - "ghcr.io/jamesread/icehive:{{ .Tag }}"
      - "ghcr.io/jamesread/icehive:latest"
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - entrypoint.sh
      - nginx-frontend.conf.template
      - frontend/dist
      - services/controller/migrations
    build_flag_templates:
      - "--build-arg=ICEHIVE_VERSION={{ .Version }}"
      - "--build-arg=ICEHIVE_CONTAINER_IMAGE=ghcr.io/jamesread/icehive:{{ .Tag }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Tag }}"
      - "--platform=linux/amd64"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Branch }}-{{ .ShortCommit }}"

changelog:
  sort: asc
  groups:
    - title: 'Security'
      regexp: '^.*?security(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Features'
      regexp: '^.*?feat.*?(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^cicd:'
      - '^chore:'
      - '^release:'
      - '^refactor:'
      - '^Merge branch'

release:
  footer: |
    ## Container image

    - `docker pull ghcr.io/jamesread/icehive:{{ .Version }}`

    ## Usage

    Set `ICEHIVE_SERVICE` to choose which service to run:

    ```
    docker run -e ICEHIVE_SERVICE=controller ghcr.io/jamesread/icehive:{{ .Version }}
    ```

    Available services: `controller`, `collector-github`, `collector-azure`, `collector-jmap`, `collector-rss`, `collector-testdata`, `persister-mysql`, `persister-yaml`, `frontend`

    Use `ICEHIVE_SERVICE=frontend` to serve the production UI bundle (nginx). NGINX proxies `/api` to the controller using **`ICEHIVE_CONTROLLER_PORT`** (Kubernetes service link, e.g. `tcp://10.96.79.247:8080`) or **`ICEHIVE_CONTROLLER_SERVICE_HOST`**. Optional: `ICEHIVE_FRONTEND_PORT` or `PORT` selects the listen port (default **8080**).
