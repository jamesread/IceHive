project_name: icehive
version: 2

builds:
  - id: controller
    env:
      - CGO_ENABLED=0
    binary: controller
    main: .
    dir: services/controller
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{ .CommitDate }}

  - id: collector-github
    env:
      - CGO_ENABLED=0
    binary: collector-github
    main: .
    dir: services/collector-github
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{ .CommitDate }}

  - id: collector-azure
    env:
      - CGO_ENABLED=0
    binary: collector-azure
    main: .
    dir: services/collector-azure
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{ .CommitDate }}

  - id: collector-jmap
    env:
      - CGO_ENABLED=0
    binary: collector-jmap
    main: .
    dir: services/collector-jmap
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{ .CommitDate }}

  - id: collector-rss
    env:
      - CGO_ENABLED=0
    binary: collector-rss
    main: .
    dir: services/collector-rss
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{ .CommitDate }}

  - id: collector-testdata
    env:
      - CGO_ENABLED=0
    binary: collector-testdata
    main: .
    dir: services/collector-testdata
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{ .CommitDate }}

  - id: persister-mysql
    env:
      - CGO_ENABLED=0
    binary: persister-mysql
    main: .
    dir: services/persister-mysql
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{ .CommitDate }}

  - id: persister-yaml
    env:
      - CGO_ENABLED=0
    binary: persister-yaml
    main: .
    dir: services/persister-yaml
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{ .CommitDate }}

archives:
  - formats: tar.gz
    files:
      - LICENSE
      - README.md
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

dockers:
  - ids:
      - controller
      - collector-github
      - collector-azure
      - collector-jmap
      - collector-rss
      - collector-testdata
      - persister-mysql
      - persister-yaml
    image_templates:
      - "ghcr.io/jamesread/icehive:{{ .Tag }}"
      - "ghcr.io/jamesread/icehive:latest"
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - entrypoint.sh
    build_flag_templates:
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Tag }}"
      - "--platform=linux/amd64"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Branch }}-{{ .ShortCommit }}"

changelog:
  sort: asc
  groups:
    - title: 'Security'
      regexp: '^.*?security(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Features'
      regexp: '^.*?feat.*?(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^cicd:'
      - '^chore:'
      - '^release:'
      - '^refactor:'
      - '^Merge branch'

release:
  footer: |
    ## Container image

    - `docker pull ghcr.io/jamesread/icehive:{{ .Version }}`

    ## Usage

    Set `ICEHIVE_SERVICE` to choose which service to run:

    ```
    docker run -e ICEHIVE_SERVICE=controller ghcr.io/jamesread/icehive:{{ .Version }}
    ```

    Available services: `controller`, `collector-github`, `collector-azure`, `collector-jmap`, `collector-rss`, `collector-testdata`, `persister-mysql`, `persister-yaml`
